<div id="player-view" class="bg-[#0a0f0a] relative" style="display:none">

  <header class="flex items-center gap-2 px-3 py-3 border-b border-[#1e2e1e] flex-shrink-0">
    <button id="btn-back" class="p-2 text-[#86efac] hover:text-[#22c55e] -ml-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>
    <div class="flex-1 min-w-0">
      <div id="player-title" class="font-bold text-[#f0fdf4] truncate leading-tight"></div>
      <div class="flex items-center gap-2">
        <div id="player-artist" class="text-[#86efac] text-xs truncate opacity-70"></div>
        <span id="player-bpm" class="hidden text-[10px] font-bold tabular-nums text-[#4ade80]/70 border border-[#4ade80]/20 rounded px-1 leading-4 flex-shrink-0">— BPM</span>
      </div>
    </div>
    <button id="btn-fullscreen" class="p-2 text-[#86efac] hover:text-[#22c55e] transition-colors" title="Fullscreen (F)">
      <svg id="fs-icon-enter" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15"/>
      </svg>
      <svg id="fs-icon-exit" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V4.5M9 9H4.5M9 9L3.75 3.75M9 15v4.5M9 15H4.5M9 15l-5.25 5.25M15 9h4.5M15 9V4.5M15 9l5.25-5.25M15 15h4.5M15 15v4.5m0-4.5l5.25 5.25"/>
      </svg>
      <span id="fs-label" class="sr-only">Fullscreen</span>
    </button>
    <button id="btn-player-actions"
      class="flex flex-col items-center p-2 text-[#86efac] hover:text-[#22c55e] transition-colors"
      title="More options">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
      <span class="text-[0.5rem] font-bold tracking-widest mt-0.5 leading-none">MORE</span>
    </button>
  </header>

  <div id="lyrics-area" class="flex-1 min-h-0 overflow-hidden relative">
    <div id="lyrics-chordify-panel" class="hidden h-full overflow-y-auto">
      <div id="lyrics-chordify-content" class="px-4 py-3 space-y-0.5"></div>
    </div>
    <div id="lyrics-spotify-panel" class="hidden h-full overflow-y-auto">
      <div id="lyrics-spotify-content" class="px-6 py-4 flex flex-col items-center"></div>
    </div>
  </div>

  <div id="stems-area" class="flex-shrink-0 border-t border-[#1e2e1e] px-2 pt-2">
    <div id="stem-loading" class="flex flex-col items-center justify-center py-4 gap-2">
      <div class="spinner"></div>
      <span id="stem-loading-text" class="text-[#86efac] text-sm">Loading…</span>
    </div>
    <div id="stem-grid" class="hidden grid gap-1.5 grid-cols-3 sm:grid-cols-6"></div>
  </div>

  <div class="flex-shrink-0 px-4 py-3 bg-[#0a0f0a] border-t border-[#1e2e1e]"
    style="padding-bottom: max(20px, env(safe-area-inset-bottom))">
    <div id="progress-bar" class="mb-2.5">
      <div id="progress-fill"></div>
    </div>
    <div class="flex items-center gap-2">
      <span id="time-current" class="text-[#86efac] text-xs tabular-nums w-9">0:00</span>
      <div class="flex-1 flex items-center justify-center gap-5">
        <button id="btn-seek-back" class="p-2 text-[#86efac] active:text-[#22c55e]">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
            <text x="9.5" y="14.5" font-size="5" fill="currentColor" font-family="system-ui" font-weight="bold">10</text>
          </svg>
        </button>
        <button id="play-btn"
          class="no-scale w-14 h-14 rounded-full bg-[#22c55e] text-[#0a0f0a] flex items-center justify-center shadow-lg active:bg-[#16a34a]">
          <svg id="icon-play" class="w-7 h-7 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-seek-forward" class="p-2 text-[#86efac] active:text-[#22c55e]">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
            <text x="9.5" y="14.5" font-size="5" fill="currentColor" font-family="system-ui" font-weight="bold">10</text>
          </svg>
        </button>
      </div>
      <span id="time-total" class="text-[#86efac] text-xs tabular-nums w-9 text-right">0:00</span>
    </div>

  </div>

  <!-- Ghost elements: chords.js reads/writes these for state tracking -->
  <span id="lyrics-toggle-btn" style="display:none"></span>
  <span id="lyrics-mode-label" style="display:none"></span>

  <!-- Player Actions Sheet -->
  <div id="player-actions-backdrop" class="hidden fixed inset-0 bg-black/60 z-40 backdrop-blur-sm"></div>
  <div id="player-actions-sheet" class="hidden fixed bottom-0 bg-[#111811] rounded-t-2xl border-t border-[#1e2e1e] z-50"
    style="left: max(0px, calc(50% - 512px)); right: max(0px, calc(50% - 512px));">
    <!-- Handle -->
    <div class="flex justify-center pt-3 pb-2">
      <div class="w-10 h-1 rounded-full bg-[#1e2e1e]"></div>
    </div>
    <!-- Volume -->
    <div class="px-5 py-3 border-b border-[#1e2e1e]">
      <div class="flex items-center gap-3">
        <button id="vol-btn" class="text-[#86efac] hover:text-[#22c55e] transition-colors flex-shrink-0" title="Mute/Unmute (M)">
          <svg id="vol-icon-on" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"/>
          </svg>
          <svg id="vol-icon-off" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"/>
          </svg>
        </button>
        <span class="flex-1 text-[10px] text-[#86efac]/50 uppercase tracking-widest font-semibold">Volume</span>
        <button id="vol-down" class="step-btn" title="Quieter (−5%)" aria-label="Quieter">−</button>
        <button id="vol-reset" class="step-value" title="Reset to 100%">
          <span id="vol-label">100%</span>
        </button>
        <button id="vol-up" class="step-btn" title="Louder (+5%)" aria-label="Louder">+</button>
      </div>
    </div>
    <!-- Tempo (shown when beats loaded) -->
    <div id="tempo-section" class="px-5 py-3 border-b border-[#1e2e1e]">
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-[#86efac] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
        </svg>
        <span class="flex-1 text-[10px] text-[#86efac]/50 uppercase tracking-widest font-semibold">Tempo</span>
        <button id="tempo-down" class="step-btn" title="Slower (−5%)" aria-label="Slower">−</button>
        <button id="tempo-reset" class="step-value" title="Reset to 100%">
          <span id="tempo-label">100%</span>
        </button>
        <button id="tempo-up" class="step-btn" title="Faster (+5%)" aria-label="Faster">+</button>
      </div>
    </div>
    <!-- Quick Action Tiles (shown when song loaded) -->
    <div id="actions-tile-section" class="hidden px-4 py-3 border-b border-[#1e2e1e]">
      <div class="flex gap-2">
        <button id="chord-sheet-open-btn" class="actions-tile flex-1 flex flex-col items-center gap-1.5 py-3 rounded-2xl bg-[#0d130d] border border-[#1e2e1e] text-[#86efac] transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5A3.375 3.375 0 0010.125 2.25H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
          </svg>
          <span class="text-[0.55rem] font-bold tracking-wide uppercase">Sheet</span>
        </button>
        <button id="lyrics-fetch-btn" class="actions-tile flex-1 flex flex-col items-center gap-1.5 py-3 rounded-2xl bg-[#0d130d] border border-[#1e2e1e] text-[#86efac] transition-all"
          title="Fetch synced lyrics from LRCLIB">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 9V5.25a.75.75 0 01.6-.735l7.5-1.5A.75.75 0 0118 3.75V15M9 9v9m0 0a3 3 0 11-6 0 3 3 0 016 0zm9-3a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span id="lyrics-fetch-label" class="text-[0.55rem] font-bold tracking-wide uppercase">Lyrics</span>
        </button>
        <!-- Kept separate from Lyrics on purpose: Lyrics asks LRCLIB, Sync times
             the lyrics we already have against the vocals stem, here. -->
        <button id="lyrics-align-btn" class="actions-tile flex-1 flex flex-col items-center gap-1.5 py-3 rounded-2xl bg-[#0d130d] border border-[#1e2e1e] text-[#86efac] transition-all"
          title="Time these lyrics locally against the vocals stem">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992V4.356m0 4.992-3.181-3.183a8.25 8.25 0 0 0-13.803 3.7M2.985 14.652h4.992v4.992m-4.992-4.992 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7"/>
          </svg>
          <span id="lyrics-align-label" class="text-[0.55rem] font-bold tracking-wide uppercase">Sync</span>
        </button>
        <button id="chord-detect-btn" class="actions-tile flex-1 flex flex-col items-center gap-1.5 py-3 rounded-2xl bg-[#0d130d] border border-[#1e2e1e] text-[#86efac] transition-all">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2m6-2a10 10 0 11-20 0 10 10 0 0120 0z"/>
          </svg>
          <span id="chord-detect-label" class="text-[0.55rem] font-bold tracking-wide uppercase">BPM</span>
        </button>
      </div>
    </div>
    <!-- Lyrics section (shown when lyrics available) -->
    <div id="lyrics-section" class="hidden px-5 py-3 border-b border-[#1e2e1e]">
      <span class="text-[10px] text-[#86efac]/50 uppercase tracking-widest font-semibold">Lyrics</span>
      <div class="flex gap-2 mt-2">
        <button id="lyrics-pill-off"      class="flex-1 py-2 rounded-xl text-xs font-semibold border border-[#1e2e1e] text-[#86efac] transition-all">Off</button>
        <button id="lyrics-pill-chordify" class="flex-1 py-2 rounded-xl text-xs font-semibold border border-[#1e2e1e] text-[#86efac] transition-all">Chords</button>
        <button id="lyrics-pill-spotify"  class="flex-1 py-2 rounded-xl text-xs font-semibold border border-[#1e2e1e] text-[#86efac] transition-all">Spotify</button>
      </div>
    </div>
    <!-- Autoscroll (fallback for songs with no synced lyrics) -->
    <div id="autoscroll-section" class="hidden px-5 py-3 border-b border-[#1e2e1e]">
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-[#86efac] flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 5.25l-7.5 7.5-7.5-7.5m15 6l-7.5 7.5-7.5-7.5"/>
        </svg>
        <span class="flex-1 text-[10px] text-[#86efac]/50 uppercase tracking-widest font-semibold">Autoscroll</span>
        <button id="autoscroll-down" class="step-btn" title="Slower (−5%)" aria-label="Scroll slower">−</button>
        <button id="autoscroll-toggle" class="step-value" title="Turn autoscroll on/off">
          <span id="autoscroll-label">OFF</span>
        </button>
        <button id="autoscroll-up" class="step-btn" title="Faster (+5%)" aria-label="Scroll faster">+</button>
      </div>
      <p class="text-[10px] text-[#86efac]/40 mt-1.5 leading-snug">
        100% reaches the end of the sheet exactly as the song finishes. Drag the sheet to nudge the alignment.
      </p>
    </div>
    <!-- Safe area -->
    <div style="height: max(24px, env(safe-area-inset-bottom))"></div>
  </div>

  <!-- Chord sheet paste modal -->
  <div id="chord-sheet-modal" class="hidden absolute inset-0 bg-[#0a0f0a]/95 z-30 flex flex-col p-4 gap-3">
    <div class="flex items-center justify-between">
      <span class="text-xs text-[#86efac] font-semibold uppercase tracking-widest">Chord Sheet</span>
      <button id="chord-sheet-close" class="text-[#86efac] hover:text-white text-lg leading-none">✕</button>
    </div>
    <!-- Cifra Club auto-fetch row -->
    <div class="flex gap-2 items-center">
      <input id="cifra-url-input" type="url"
        placeholder="Cifra Club URL (leave blank to auto-search)"
        class="flex-1 bg-[#172017] border border-[#1e2e1e] rounded-lg px-2 py-1.5 text-xs text-[#f0fdf4] placeholder-[#86efac]/30 outline-none focus:border-[#22c55e]/50"/>
      <button id="cifra-fetch-btn"
        class="text-xs bg-[#172017] border border-[#1e2e1e] hover:border-[#22c55e]/60 text-[#86efac] hover:text-green-300 rounded-lg px-3 py-1.5 transition-colors flex-shrink-0 disabled:opacity-40">
        Fetch
      </button>
    </div>
    <span id="cifra-fetch-status" class="text-[10px] text-[#86efac]/50 -mt-1.5 min-h-[14px]"></span>
    <p class="text-[10px] text-[#86efac]/60 leading-snug">
      Or paste chord + lyrics text manually. Chord lines are detected automatically and paired with the lyric line below them.
    </p>
    <textarea id="chord-sheet-input"
      class="flex-1 bg-[#172017] border border-[#1e2e1e] rounded-lg px-3 py-2 text-xs text-[#f0fdf4] font-mono placeholder-[#86efac]/30 outline-none resize-none"
      placeholder="Em&#10;No, no es necesario&#10;         D&#10;Que lo entienda&#10;         C&#10;Porque nunca le ha servido"></textarea>
    <div class="flex justify-end gap-2">
      <button id="chord-sheet-clear-btn" class="text-xs text-[#f87171]/60 hover:text-[#f87171] px-3 py-1.5 transition-colors">Clear</button>
      <button id="chord-sheet-cancel" class="text-xs text-[#86efac]/60 hover:text-[#86efac] px-3 py-1.5">Cancel</button>
      <button id="chord-sheet-save" class="text-xs bg-[#22c55e] hover:bg-[#16a34a] text-black font-semibold rounded-lg px-4 py-1.5 transition-colors">Save</button>
    </div>
  </div>

</div>
